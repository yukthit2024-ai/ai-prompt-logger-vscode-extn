name: CI/CD Build VSIX

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compile Extension
        run: npm run compile

      - name: Run Lint
        run: npm run lint

      - name: Get current timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d.%H%M%S')" >> $GITHUB_ENV

      - name: Package Extension (VSIX)
        run: npx @vscode/vsce package -o AI_Prompts_Logger_${{ env.TIMESTAMP }}.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Prompts_Logger_${{ env.TIMESTAMP }}
          path: AI_Prompts_Logger_${{ env.TIMESTAMP }}.vsix
